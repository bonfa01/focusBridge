<!DOCTYPE html>
<html>
<head>
    <title>FocusBridge Dashboard</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <div class="card">
        <h2>Focus Bridge</h2>
        <p>Imposta i minuti e avvia.</p>
        
        <div class="input-group">
            <label>LAVORO</label> 
            <input type="number" id="work" value="50">
        </div>
        <div class="input-group">
            <label>PAUSA</label> 
            <input type="number" id="break" value="10">
        </div>
        
        <button class="btn-start" onclick="start()">AVVIA SESSIONE</button>
        <button class="btn-stop" onclick="stop()">STOPPA TUTTO</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        function start() {
            const config = {
                work: document.getElementById('work').value,
                break: document.getElementById('break').value
            };
            ipcRenderer.send('start-session', config);
        }
        function stop() {
            ipcRenderer.send('stop-session');
        }
    </script>
</body>
</html>
